name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        # bash expands globs and multi-line scripts consistently on
        # Ubuntu and Windows (GitHub-hosted runners include bash).
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,yaml]"

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Run tests
        run: pytest --tb=short -q

      - name: Build wheel
        run: python -m build --wheel

      - name: Clean wheel-only install (black-box)
        run: |
          pip uninstall agentgear -y
          # Resolve the wheel path in Python so this stays shell-agnostic
          # across bash-on-Windows and bash-on-Ubuntu (see known Windows
          # `dist/*.whl` glob pitfall).
          WHEEL=$(python -c "import glob; ws=glob.glob('dist/*.whl'); assert ws, 'no wheel in dist/'; print(ws[0])")
          pip install "$WHEEL"
          python -c "import agentgear; print('import OK:', agentgear.__version__)"

      - name: CLI smoke test
        run: |
          agentgear analyze --task "Rename a local variable" --json
          agentgear plan --task "Refactor authentication across 8 files" --files 8 --modules 3 --architectural 0.4 --security 0.6 --json
          agentgear simulate --task "Fix a flaky test" --repeated-failures 2 --json

      - name: Standalone black-box test (no siblings, no network, no API keys)
        run: |
          python - <<'PY'
          import agentgear
          from agentgear import _sibling_utils
          from agentgear.watchdog import ExecutionStateMachine
          from agentgear.models import ExecutionState

          for name in ("promptgraph", "skillguard", "agentbench", "projectkaizen"):
              assert _sibling_utils.is_installed(name) is False, f"unexpected sibling: {name}"

          task = agentgear.TaskProfile(description="Fix a bug", files_affected=2)
          plan = agentgear.plan(task)
          assert plan.primary_model.tier is not None

          sm = ExecutionStateMachine(execution_id="ci-smoke")
          sm.transition(ExecutionState.RUNNING, at_seconds=1.0)
          sm.transition(ExecutionState.STALLED, at_seconds=2.0)
          sm.transition(ExecutionState.RECOVERING, at_seconds=3.0)
          sm.transition(ExecutionState.RUNNING, at_seconds=4.0)
          assert sm.state == ExecutionState.RUNNING

          print("Standalone OK")
          PY
